<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>独立盲测集人工分割标注</title>
  <style>
    :root{--bg:#0d1519;--panel:#172329;--line:#30434c;--text:#eaf2f4;--muted:#9fb2ba;--green:#42c789;--blue:#2381ae;--red:#f16c68;--amber:#e8b64c}
    *{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,"Microsoft YaHei",sans-serif}button,input{font:inherit}button{border:1px solid var(--line);border-radius:7px;padding:8px 11px;color:var(--text);background:#223139;cursor:pointer}button:hover{filter:brightness(1.14)}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#17754e}.blue{background:#176388}.danger{background:#7d383a}.warn{background:#705522}
    .app{height:100%;display:grid;grid-template-columns:250px minmax(0,1fr) 300px}.side,.right{min-height:0;background:var(--panel);display:flex;flex-direction:column}.side{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.head,.info,.attest{padding:13px;border-bottom:1px solid var(--line)}h1{font-size:17px;margin:0 0 7px}.muted{color:var(--muted);font-size:12px}.progress{height:7px;margin-top:9px;background:#0a1013;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--green)}.items{padding:7px;overflow:auto}.item{width:100%;display:grid;grid-template-columns:28px 1fr auto;gap:7px;align-items:center;border:0;margin:2px 0;padding:8px;text-align:left;background:transparent}.item:hover{background:#22343c}.item.active{background:#294751}.item.done .name{color:var(--green)}.item.draft .name:after{content:' · 草稿';color:var(--amber);font-size:11px}.count{color:var(--muted);font-size:11px}
    main{min-width:0;min-height:0;display:grid;grid-template-rows:52px minmax(0,1fr) 58px}.toolbar,.actions{display:flex;align-items:center;gap:7px;padding:8px 11px;background:#142027}.toolbar{border-bottom:1px solid var(--line)}.actions{border-top:1px solid var(--line)}.title{min-width:0;margin-right:auto}.title strong{display:block}.canvas-wrap{position:relative;min-height:0;overflow:hidden;background:#070b0d}canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none}canvas.draw{cursor:crosshair}.hint{position:absolute;left:12px;bottom:12px;max-width:600px;padding:7px 10px;border:1px solid #405660;border-radius:7px;background:#081014dc;pointer-events:none}.spacer{flex:1}.dirty{color:var(--amber)}
    .right h2{font-size:14px;margin:0 0 8px}.right dl{display:grid;grid-template-columns:68px 1fr;gap:6px;margin:0;font-size:12px}.right dt{color:var(--muted)}.right dd{margin:0;overflow-wrap:anywhere}.policy{padding:13px;overflow:auto;color:#d8e4e8}.policy li{margin:8px 0}.attest{margin-top:auto;border-top:1px solid var(--line);border-bottom:0}.attest input{width:100%;margin:7px 0;padding:8px;color:var(--text);background:#0e171b;border:1px solid var(--line);border-radius:6px}.toast{position:fixed;z-index:5;left:50%;top:18px;transform:translateX(-50%);display:none;padding:9px 14px;border-radius:7px;background:#286044;box-shadow:0 6px 24px #0008}.toast.error{background:#87393a}@media(max-width:1050px){.app{grid-template-columns:220px minmax(0,1fr)}.right{display:none}}
    .item.warning{border-left:4px solid var(--red);background:#4a292b}.item.warning .name{color:#ffaaa6}.warning-count{color:#ffaaa6;font-weight:700}.warning-box{margin-top:7px;padding:8px;border:1px solid #8c4b4d;border-radius:6px;background:#3a2325;color:#ffd0cd}.warning-box ul{margin:5px 0 0;padding-left:18px}.warning-box li{margin:3px 0}
  </style>
</head>
<body><div class="app">
  <aside class="side"><div class="head"><h1>新盲测人工标注</h1><div id="summary" class="muted">读取中…</div><div class="progress"><i id="bar"></i></div></div><div id="items" class="items"></div></aside>
  <main><div class="toolbar"><div class="title"><strong id="title">请选择图片</strong><span id="subtitle" class="muted"></span></div><button id="zoomOut">缩小</button><button id="fit">适应</button><button id="zoomIn">放大</button><button id="undoSave" class="warn">撤销保存</button></div>
    <div class="canvas-wrap" id="wrap"><canvas id="canvas"></canvas><div class="hint" id="hint">只看 RGB 原图，沿目标边缘逐点绘制；右键或 Enter 完成轮廓。</div></div>
    <div class="actions"><button id="add" class="blue">新增 N</button><button id="redraw">重画 R</button><button id="delete" class="danger">删除 Del</button><button id="undoPoint">撤销点</button><button id="finish">完成轮廓 Enter</button><button id="cancel">取消 Esc</button><span class="spacer"></span><span id="dirty" class="dirty"></span><button id="draft">暂存</button><button id="save" class="primary">完成本图 Ctrl+S</button></div>
  </main>
  <section class="right"><div class="info"><h2>当前样本</h2><dl id="details"></dl></div><div class="policy"><h2>盲测纪律</h2><ol><li>只依据本页 RGB 原图人工绘制，不查看任何候选或生产模型预测。</li><li>边界应贴合目标，互不相交；遗漏、误标都会直接影响一次性终审。</li><li>确认没有目标时可保存空标签，但必须再次确认。</li><li>封存后标签只读，不能因测试结果继续修改。</li></ol><p class="muted">此服务没有模型预测路由，也不读取旧测试结果。</p></div><div class="attest"><label for="actor">标注员标识</label><input id="actor" maxlength="80" placeholder="姓名或内部标识"><button id="seal" class="primary">30 张完成后封存真值</button></div></section>
</div><div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id),clone=x=>JSON.parse(JSON.stringify(x));
const canvas=$('canvas'),ctx=canvas.getContext('2d');
const app={items:[],status:null,item:null,image:null,polygons:[],selected:-1,mode:null,draft:[],scale:1,ox:0,oy:0,drag:null,dirty:false,draftSaved:true,timer:null};
const ATTESTATION={{ attestation|tojson }};
async function json(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...options}),d=await r.json();if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);return d}
function toast(msg,error=false){const t=$('toast');t.textContent=msg;t.className='toast'+(error?' error':'');t.style.display='block';clearTimeout(t.timer);t.timer=setTimeout(()=>t.style.display='none',3200)}
function actor(){const value=$('actor').value.trim();localStorage.setItem('blindAnnotator',value);return value}
function renderList(){const s=app.status;$('summary').textContent=`已完成 ${s.completed}/${s.total}，剩余 ${s.remaining}，草稿 ${s.drafts}${s.sealed?' · 已封存':''}`;$('bar').style.width=`${100*s.completed/s.total}%`;$('items').innerHTML=app.items.map(x=>`<button class="item ${x.status==='annotated'?'done':''} ${x.has_draft?'draft':''} ${app.item&&x.stem===app.item.stem?'active':''}" data-stem="${x.stem}"><span>${x.index}</span><span class="name">${x.stem}</span><span class="count">${x.polygon_count==null?'待':x.polygon_count+' 个'}</span></button>`).join('');document.querySelectorAll('.item').forEach(b=>b.onclick=()=>openItem(b.dataset.stem));$('undoSave').disabled=!s.can_undo;$('seal').disabled=s.sealed||s.remaining>0||s.drafts>0}
async function refresh(preferred){const d=await json('/api/items');app.items=d.items;app.status=d.status;renderList();if(!app.item){const row=app.items.find(x=>x.stem===preferred)||app.items.find(x=>x.status==='pending')||app.items[0];if(row)await openItem(row.stem)}}
async function openItem(stem){if(app.item&&app.item.stem!==stem&&app.dirty&&!app.draftSaved)await saveDraft(false);const x=await json('/api/item/'+encodeURIComponent(stem));app.item=x;app.polygons=clone(x.workspace.polygons);app.selected=x.workspace.selected??-1;app.mode=x.workspace.mode;app.draft=clone(x.workspace.draft||[]);app.dirty=x.has_draft;app.draftSaved=true;const im=new Image();im.onload=()=>{app.image=im;fit();draw()};im.src=x.image_url+'?t='+Date.now();$('title').textContent=`${x.index}. ${x.image}`;$('subtitle').textContent=`${x.status==='annotated'?'已正式保存':'待标注'} · 当前 ${x.polygon_count} 个轮廓`;$('details').innerHTML=`<dt>状态</dt><dd>${x.sealed?'已封存':x.status==='annotated'?'已保存':x.has_draft?'草稿':'待标注'}</dd><dt>轮廓</dt><dd>${x.polygon_count} 个</dd><dt>标注员</dt><dd>${x.actor||'—'}</dd><dt>更新时间</dt><dd>${x.updated_at||'—'}</dd>`;canvas.classList.toggle('draw',!!app.mode);renderList();updateUi()}
function resize(){const r=$('wrap').getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);draw()}
function fit(){if(!app.image)return;const r=$('wrap').getBoundingClientRect();app.scale=Math.min(r.width/app.image.width,r.height/app.image.height)*.94;app.ox=(r.width-app.image.width*app.scale)/2;app.oy=(r.height-app.image.height*app.scale)/2;draw()}
function ip(e){const r=canvas.getBoundingClientRect();return[(e.clientX-r.left-app.ox)/(app.image.width*app.scale),(e.clientY-r.top-app.oy)/(app.image.height*app.scale)]}function sp(p){return[app.ox+p[0]*app.image.width*app.scale,app.oy+p[1]*app.image.height*app.scale]}
function path(points,close=true){if(!points.length)return;ctx.beginPath();ctx.moveTo(...sp(points[0]));for(const p of points.slice(1))ctx.lineTo(...sp(p));if(close)ctx.closePath()}
function draw(){const r=$('wrap').getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);if(!app.image)return;ctx.drawImage(app.image,app.ox,app.oy,app.image.width*app.scale,app.image.height*app.scale);app.polygons.forEach((p,i)=>{path(p.points);ctx.fillStyle=i===app.selected?'#f16c684c':'#29d7cf2b';ctx.strokeStyle=i===app.selected?'#f16c68':'#43d8d0';ctx.lineWidth=i===app.selected?2.5:1.3;ctx.fill();ctx.stroke()});if(app.draft.length){path(app.draft,false);ctx.strokeStyle='#ffd15a';ctx.lineWidth=2;ctx.stroke();app.draft.map(sp).forEach(p=>{ctx.beginPath();ctx.arc(...p,3,0,Math.PI*2);ctx.fillStyle='#ffd15a';ctx.fill()})}}
  function renderListWithWarnings(){const s=app.status;$('summary').textContent=`已完成 ${s.completed}/${s.total}，剩余 ${s.remaining}，草稿 ${s.drafts}，异常 ${s.warning_images||0}${s.sealed?' · 已封存':''}`;$('bar').style.width=`${100*s.completed/s.total}%`;$('items').innerHTML=app.items.map(x=>`<button class="item ${x.status==='annotated'?'done':''} ${x.has_draft?'draft':''} ${x.has_warning?'warning':''} ${app.item&&x.stem===app.item.stem?'active':''}" data-stem="${x.stem}"><span>${x.index}</span><span class="name">${x.stem}${x.has_draft?' · 草稿':''}</span><span class="count ${x.has_warning?'warning-count':''}">${x.has_warning?'异常 '+x.warning_count:x.polygon_count==null?'待':x.polygon_count+' 个'}</span></button>`).join('');document.querySelectorAll('.item').forEach(b=>b.onclick=()=>openItem(b.dataset.stem));$('undoSave').disabled=!s.can_undo;$('seal').disabled=s.sealed||s.remaining>0||s.drafts>0}
  async function openItemWithWarnings(stem){if(app.item&&app.item.stem!==stem&&app.dirty&&!app.draftSaved)await saveDraft(false);const x=await json('/api/item/'+encodeURIComponent(stem));app.item=x;app.polygons=clone(x.workspace.polygons);app.selected=x.workspace.selected??-1;app.mode=x.workspace.mode;app.draft=clone(x.workspace.draft||[]);app.dirty=x.has_draft;app.draftSaved=true;const im=new Image();im.onload=()=>{app.image=im;fit();draw()};im.src=x.image_url+'?t='+Date.now();$('title').textContent=`${x.index}. ${x.image}`;$('subtitle').textContent=`${x.status==='annotated'?'已正式保存':'待标注'} · 当前 ${x.polygon_count} 个轮廓${x.has_warning?' · 检出异常 '+x.warning_count+' 项':''}`;const warningHtml=x.has_warning?`<div class="warning-box"><strong>需要人工复核：${x.warning_count} 项</strong><ul>${x.warnings.map(w=>`<li>${w.detail}</li>`).join('')}</ul></div>`:'<div class="muted">自动质量检查未发现异常</div>';$('details').innerHTML=`<dt>状态</dt><dd>${x.sealed?'已封存':x.status==='annotated'?'已保存':x.has_draft?'草稿':'待标注'}</dd><dt>轮廓</dt><dd>${x.polygon_count} 个</dd><dt>标注员</dt><dd>${x.actor||'—'}</dd><dt>更新时间</dt><dd>${x.updated_at||'—'}</dd><dt>质量检查</dt><dd>${warningHtml}</dd>`;canvas.classList.toggle('draw',!!app.mode);renderList();updateUi()}
  function drawPolygonNumber(p,i,abnormal,selected,r){const c=p.points.reduce((a,q)=>[a[0]+q[0],a[1]+q[1]],[0,0]).map(v=>v/p.points.length);let [x,y]=sp(c);x=Math.max(12,Math.min(r.width-12,x));y=Math.max(12,Math.min(r.height-12,y));const text=String(i+1);ctx.font=selected?'bold 13px system-ui':'bold 11px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';const width=Math.max(17,ctx.measureText(text).width+8),height=17;ctx.fillStyle=abnormal?'#b83236':selected?'#d18b18':'#133c4b';ctx.strokeStyle='#ffffff';ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(x-width/2,y-height/2,width,height,4);ctx.fill();ctx.stroke();ctx.fillStyle='#ffffff';ctx.fillText(text,x,y+.5)}
  function drawWithWarnings(){const r=$('wrap').getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);if(!app.image)return;ctx.drawImage(app.image,app.ox,app.oy,app.image.width*app.scale,app.image.height*app.scale);const flagged=new Set((app.item?.warnings||[]).flatMap(w=>w.polygon_indices||[]));app.polygons.forEach((p,i)=>{path(p.points);const abnormal=flagged.has(i),selected=i===app.selected;ctx.fillStyle=abnormal?'#f16c6855':selected?'#f16c684c':'#29d7cf2b';ctx.strokeStyle=abnormal?'#ff4d47':selected?'#f16c68':'#43d8d0';ctx.lineWidth=abnormal?3:selected?2.5:1.3;ctx.fill();ctx.stroke();drawPolygonNumber(p,i,abnormal,selected,r)});if(app.draft.length){path(app.draft,false);ctx.strokeStyle='#ffd15a';ctx.lineWidth=2;ctx.stroke();app.draft.map(sp).forEach(p=>{ctx.beginPath();ctx.arc(...p,3,0,Math.PI*2);ctx.fillStyle='#ffd15a';ctx.fill()})}}
  renderList=renderListWithWarnings;openItem=openItemWithWarnings;draw=drawWithWarnings;
  function area(p){let s=0;for(let i=0,j=p.length-1;i<p.length;j=i++)s+=p[j][0]*p[i][1]-p[i][0]*p[j][1];return Math.abs(s)/2}function inside(q,p){let v=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];if((a[1]>q[1])!==(b[1]>q[1])&&q[0]<(b[0]-a[0])*(q[1]-a[1])/(b[1]-a[1])+a[0])v=!v}return v}function select(q){const hits=app.polygons.map((p,i)=>({i,a:area(p.points)})).filter(x=>inside(q,app.polygons[x.i].points)).sort((a,b)=>a.a-b.a);app.selected=hits.length?hits[0].i:-1;updateUi();draw()}
function workspace(){return{polygons:app.polygons.map(p=>({class_id:p.class_id,points:p.points})),draft:app.draft,mode:app.mode,selected:app.selected}}function mark(){app.dirty=true;app.draftSaved=false;updateUi();clearTimeout(app.timer);app.timer=setTimeout(()=>saveDraft(false),500)}
async function saveDraft(show=true){if(!app.item||app.status.sealed)return;clearTimeout(app.timer);try{const d=await json(`/api/item/${app.item.stem}/draft`,{method:'POST',body:JSON.stringify({workspace:workspace()})});app.status=d.status;app.draftSaved=true;const row=app.items.find(x=>x.stem===app.item.stem);if(row)row.has_draft=true;renderList();updateUi();if(show)toast('草稿已暂存')}catch(e){app.draftSaved=false;updateUi();if(show)toast(e.message,true)}}
function setMode(mode){if(app.status.sealed)return;if(mode==='redraw'&&app.selected<0)return toast('请先选中一个轮廓',true);app.mode=mode;app.draft=[];canvas.classList.add('draw');$('hint').textContent=mode==='add'?'沿目标边缘点击，Enter 或右键完成。':'重新沿正确边缘点击，完成后替换选中轮廓。';updateUi();draw()}function finish(){if(!app.mode)return;if(app.draft.length<3)return toast('至少需要 3 个点',true);const p={class_id:'0',points:clone(app.draft),issues:[]};if(app.mode==='add'){app.polygons.push(p);app.selected=app.polygons.length-1}else app.polygons[app.selected]=p;app.mode=null;app.draft=[];canvas.classList.remove('draw');mark();draw()}function cancel(){app.mode=null;app.draft=[];canvas.classList.remove('draw');updateUi();draw()}
function updateUi(){const locked=!app.item||app.status?.sealed,drawing=!!app.mode;$('add').disabled=locked||drawing;$('redraw').disabled=locked||drawing||app.selected<0;$('delete').disabled=locked||drawing||app.selected<0;$('undoPoint').disabled=!drawing||!app.draft.length;$('finish').disabled=!drawing||app.draft.length<3;$('cancel').disabled=!drawing;$('draft').disabled=locked;$('save').disabled=locked||drawing;$('dirty').textContent=app.dirty?(app.draftSaved?'草稿已暂存':'暂存中…'):''}
canvas.onpointerdown=e=>{if(!app.image)return;if(app.mode){const p=ip(e);if(p.every(v=>v>=0&&v<=1)){app.draft.push(p);mark();draw()}return}app.drag={x:e.clientX,y:e.clientY,ox:app.ox,oy:app.oy,moved:false};canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!app.drag||app.mode)return;const dx=e.clientX-app.drag.x,dy=e.clientY-app.drag.y;if(Math.abs(dx)+Math.abs(dy)>4)app.drag.moved=true;app.ox=app.drag.ox+dx;app.oy=app.drag.oy+dy;draw()};canvas.onpointerup=e=>{if(!app.drag)return;const moved=app.drag.moved;app.drag=null;if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);if(!moved)select(ip(e))};canvas.oncontextmenu=e=>{e.preventDefault();finish()};canvas.onwheel=e=>{e.preventDefault();if(!app.image)return;const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,f=e.deltaY<0?1.16:.86;app.ox=x-(x-app.ox)*f;app.oy=y-(y-app.oy)*f;app.scale*=f;draw()};
$('zoomIn').onclick=()=>{app.scale*=1.2;draw()};$('zoomOut').onclick=()=>{app.scale*=.83;draw()};$('fit').onclick=fit;$('add').onclick=()=>setMode('add');$('redraw').onclick=()=>setMode('redraw');$('delete').onclick=()=>{if(app.selected>=0&&confirm('删除选中轮廓？')){app.polygons.splice(app.selected,1);app.selected=-1;mark();draw()}};$('undoPoint').onclick=()=>{app.draft.pop();mark();draw()};$('finish').onclick=finish;$('cancel').onclick=cancel;$('draft').onclick=()=>saveDraft(true);
$('save').onclick=async()=>{try{const empty=app.polygons.length===0;if(empty&&!confirm('确认本图完全没有目标并保存空标签？'))return;const stem=app.item.stem,d=await json(`/api/item/${stem}/save`,{method:'POST',body:JSON.stringify({polygons:app.polygons,actor:actor(),confirm_empty:empty})});app.dirty=false;app.draftSaved=true;toast(`已保存 ${app.polygons.length} 个人工轮廓`);app.item=null;await refresh();}catch(e){toast(e.message,true)}};$('undoSave').onclick=async()=>{try{const d=await json('/api/undo',{method:'POST',body:'{}'});toast(`已撤销 ${d.stem}`);app.item=null;await refresh(d.stem)}catch(e){toast(e.message,true)}};$('seal').onclick=async()=>{if(!confirm('封存后标签只读，确认 30 张均已人工复核？'))return;try{await json('/api/seal',{method:'POST',body:JSON.stringify({actor:actor(),attestation:ATTESTATION})});toast('人工真值已封存，可进入一次性终审');app.item=null;await refresh()}catch(e){toast(e.message,true)}};
  function requireActor(){let value=actor();if(value.length>=2)return value;const entered=prompt('请输入至少 2 个字符的标注员姓名或工号',value);if(entered===null)return null;$('actor').value=entered.trim();value=actor();if(value.length<2){toast('标注员姓名或工号至少需要 2 个字符',true);return null}return value}
  $('save').onclick=async()=>{try{const who=requireActor();if(!who)return;const empty=app.polygons.length===0;if(empty&&!confirm('确认本图完全没有目标并保存空标签？'))return;const stem=app.item.stem,d=await json(`/api/item/${stem}/save`,{method:'POST',body:JSON.stringify({polygons:app.polygons,actor:who,confirm_empty:empty})});app.dirty=false;app.draftSaved=true;toast(d.item.has_warning?`已保存，自动检查发现 ${d.item.warning_count} 项异常，请复核红色标记`:`已保存 ${app.polygons.length} 个人工轮廓`);app.item=null;await refresh()}catch(e){toast(e.message,true)}};
  window.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();$('save').click()}else if(e.key==='Enter')finish();else if(e.key==='Escape')cancel();else if(e.key==='Delete')$('delete').click();else if(e.key.toLowerCase()==='n')setMode('add');else if(e.key.toLowerCase()==='r')setMode('redraw')};new ResizeObserver(resize).observe($('wrap'));$('actor').value=localStorage.getItem('blindAnnotator')||'';window.addEventListener('pagehide',()=>{if(app.item&&app.dirty&&!app.draftSaved)fetch(`/api/item/${app.item.stem}/draft`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({workspace:workspace()}),keepalive:true})});refresh().catch(e=>toast(e.message,true));
</script></body></html>
