<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>困难样本整图标注修正</title>
  <style>
    :root { --bg:#0f171b; --panel:#182329; --line:#30434c; --text:#e9f1f3; --muted:#9cb0b8; --green:#46c78a; --blue:#42a5d8; --red:#ff6e67; --amber:#e9b64d; }
    * { box-sizing:border-box; }
    body { margin:0; height:100vh; overflow:hidden; color:var(--text); background:var(--bg); font:14px/1.4 system-ui,"Microsoft YaHei",sans-serif; }
    button { border:1px solid var(--line); border-radius:7px; padding:8px 12px; color:var(--text); background:#223039; cursor:pointer; }
    button:hover { filter:brightness(1.15); } button:disabled { opacity:.42; cursor:not-allowed; }
    button.primary { background:#17764f; border-color:#279969; } button.blue { background:#176286; } button.danger { background:#813b3c; } button.warn { background:#725622; }
    .app { height:100%; display:grid; grid-template-columns:260px minmax(0,1fr) 320px; }
    aside { min-height:0; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; }
    .head { padding:14px; border-bottom:1px solid var(--line); }
    h1 { margin:0 0 8px; font-size:17px; } .sub { color:var(--muted); font-size:12px; }
    .progress { margin-top:10px; height:7px; border-radius:99px; background:#0c1215; overflow:hidden; }
    .progress i { display:block; height:100%; background:var(--green); width:0; }
    .items { overflow:auto; padding:7px; }
    .item { width:100%; display:grid; grid-template-columns:28px 1fr auto; gap:7px; align-items:center; border:0; border-radius:7px; margin:2px 0; padding:8px; text-align:left; background:transparent; }
    .item:hover { background:#22323a; } .item.active { background:#28444f; } .item.done .name { color:var(--green); }
    .item.draft .name::after { content:' · 草稿'; color:var(--amber); font-size:11px; }
    .rank { color:var(--muted); text-align:right; } .name { overflow:hidden; text-overflow:ellipsis; } .metric { color:var(--muted); font-size:11px; }
    main { min-width:0; min-height:0; display:grid; grid-template-rows:52px minmax(0,1fr) 58px; }
    .toolbar { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line); background:#152027; }
    .toolbar .title { min-width:0; margin-right:auto; } .toolbar strong { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .canvas-wrap { min-width:0; min-height:0; position:relative; overflow:hidden; background:#080c0e; }
    canvas { width:100%; height:100%; display:block; cursor:grab; touch-action:none; } canvas.draw { cursor:crosshair; }
    .hint { position:absolute; left:12px; bottom:12px; max-width:520px; border:1px solid #405560; border-radius:7px; padding:7px 10px; color:#d9e5e9; background:#0a1115d9; pointer-events:none; }
    .actions { padding:9px 12px; display:flex; gap:8px; align-items:center; border-top:1px solid var(--line); background:#152027; }
    .actions .spacer { flex:1; } .dirty { color:var(--amber); }
    .right { min-height:0; display:grid; grid-template-rows:auto minmax(0,1fr) auto; background:var(--panel); border-left:1px solid var(--line); }
    .details { padding:12px; border-bottom:1px solid var(--line); }
    .details dl { margin:8px 0 0; display:grid; grid-template-columns:78px 1fr; gap:5px; font-size:12px; }
    dt { color:var(--muted); } dd { margin:0; overflow-wrap:anywhere; }
    .prediction { min-height:0; padding:10px; display:flex; flex-direction:column; }
    .prediction h2 { margin:0 0 8px; font-size:14px; }
    .prediction img { min-width:0; min-height:0; width:100%; height:100%; object-fit:contain; background:#0b1114; border:1px solid var(--line); }
    .legend { padding:10px 12px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
    .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin:0 4px 0 10px; } .dot:first-child{margin-left:0}.cyan{background:#42d5d0}.red{background:var(--red)}.yellow{background:#ffd15a}
    .toast { position:fixed; left:50%; top:18px; transform:translateX(-50%); z-index:5; padding:9px 14px; border-radius:7px; background:#285e46; box-shadow:0 6px 24px #0008; display:none; }
    .toast.error { background:#8a3b3b; }
    @media(max-width:1050px){.app{grid-template-columns:220px minmax(0,1fr)}.right{display:none}}
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="head"><h1>整图标注修正</h1><div id="summary" class="sub">正在读取...</div><div class="progress"><i id="bar"></i></div></div>
    <div class="items" id="items"></div>
  </aside>
  <main>
    <div class="toolbar">
      <div class="title"><strong id="title">请选择图片</strong><span id="subtitle" class="sub"></span></div>
      <button id="zoomOut">缩小</button><button id="fit">适应</button><button id="zoomIn">放大</button><button id="nextInvalid" class="warn">下一个异常 I</button><button id="undoSave" class="warn">撤销上次保存</button>
    </div>
    <div class="canvas-wrap" id="wrap"><canvas id="canvas"></canvas><div class="hint" id="hint">青色是现有标签。单击轮廓选中，随后可重画或删除；漏标区域请用“新增轮廓”。</div></div>
    <div class="actions">
      <button id="add" class="blue">新增轮廓 N</button><button id="redraw">重画选中 R</button><button id="delete" class="danger">删除选中 Del</button>
      <button id="undoPoint">撤销点</button><button id="finishPolygon">完成当前轮廓 Enter</button><button id="cancelDraw">取消绘制 Esc</button>
      <span class="spacer"></span><span id="dirty" class="dirty"></span><button id="saveDraft">暂存草稿</button><button id="save" class="primary">完成本图并保存 Ctrl+S</button>
    </div>
  </main>
  <section class="right">
    <div class="details"><strong>当前样本</strong><dl id="details"></dl></div>
    <div class="prediction"><h2>模型预测参考（只辅助判断）</h2><img id="prediction" alt="预测参考"></div>
    <div class="legend"><span class="dot cyan"></span>现有轮廓 <span class="dot red"></span>选中轮廓 <span class="dot yellow"></span>正在绘制<br><span style="color:#ff69c8">紫色轮廓是自动检测到的几何异常。</span><br>草稿会自动暂存；正式保存会同步 Data_v3 与规范源标签，并可撤销。</div>
  </section>
</div>
<div class="toast" id="toast"></div>
<script>
  const $ = id => document.getElementById(id);
  const canvas=$('canvas'), ctx=canvas.getContext('2d');
  const app={items:[],status:null,item:null,image:null,polygons:[],selected:-1,mode:null,draft:[],dirty:false,draftSaved:true,draftTimer:null,scale:1,ox:0,oy:0,drag:null};
  function toast(message,error=false){const e=$('toast');e.textContent=message;e.className='toast'+(error?' error':'');e.style.display='block';setTimeout(()=>e.style.display='none',2600)}
  async function json(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...options});const data=await r.json();if(!r.ok)throw new Error(data.error||`请求失败 ${r.status}`);return data}
  function clone(value){return JSON.parse(JSON.stringify(value))}
  function renderList(status){
    $('summary').textContent=`已完成 ${status.completed}/${status.total}，剩余 ${status.remaining}，草稿 ${status.drafts||0}`;$('bar').style.width=`${status.total?100*status.completed/status.total:0}%`;$('undoSave').disabled=!status.can_undo;
    $('items').innerHTML=app.items.map(row=>`<button class="item ${row.status==='corrected'?'done':''} ${row.has_draft?'draft':''} ${app.item&&row.image===app.item.image?'active':''}" data-image="${row.image}"><span class="rank">${row.rank}</span><span class="name">${row.image}</span><span class="metric">F1 ${Number(row.mask_f1).toFixed(2)}</span></button>`).join('');
    document.querySelectorAll('.item').forEach(e=>e.onclick=()=>openItem(e.dataset.image));
  }
  async function refresh(preferred){const data=await json('/api/items');app.items=data.items;app.status=data.status;renderList(data.status);if(!app.item){const row=app.items.find(x=>x.image===preferred)||app.items.find(x=>x.status==='pending')||app.items[0];if(row)await openItem(row.image)}}
  async function openItem(image){
    if(app.item&&app.item.image!==image&&app.dirty&&!app.draftSaved)await saveDraft(false);
    const item=await json('/api/item/'+encodeURIComponent(image));app.item=item;app.polygons=clone(item.workspace.polygons);app.selected=item.workspace.selected??-1;app.mode=item.workspace.mode;app.draft=clone(item.workspace.draft||[]);app.dirty=item.has_draft;app.draftSaved=true;
    const img=new Image();img.onload=()=>{app.image=img;fit();draw()};img.src=item.image_url+'?t='+Date.now();$('prediction').src=item.prediction_url+'?t='+Date.now();
    $('title').textContent=`${item.rank}. ${item.image}`;$('subtitle').textContent=`${item.reasons||''} · 当前 ${item.polygon_count} 个轮廓 · 几何异常 ${item.invalid_polygon_count}`;
    $('details').innerHTML=`<dt>状态</dt><dd>${item.status==='corrected'?'已正式保存':item.has_draft?'有已暂存草稿':'待修正'}</dd><dt>Mask F1</dt><dd>${item.mask_f1}</dd><dt>误检 / 漏检</dt><dd>${item.mask_fp} / ${item.mask_fn}</dd><dt>异常轮廓</dt><dd>${item.invalid_polygon_count} 个（紫色）</dd><dt>标签告警</dt><dd>${item.label_warning_codes||'无自动告警'}</dd><dt>标签文件</dt><dd>${item.label_path}</dd>`;
    canvas.classList.toggle('draw',!!app.mode);$('hint').textContent=app.mode==='add'?'已恢复新增轮廓草稿：继续点击，按 Enter 完成。':app.mode==='redraw'?'已恢复重画草稿：继续点击，按 Enter 完成。':'青色是现有标签，紫色是几何异常。单击轮廓可选中、重画或删除。';
    updateUi();renderList(app.status);
  }
  function resize(){const r=$('wrap').getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);draw()}
  function fit(){if(!app.image)return;const r=$('wrap').getBoundingClientRect();app.scale=Math.min(r.width/app.image.width,r.height/app.image.height)*.94;app.ox=(r.width-app.image.width*app.scale)/2;app.oy=(r.height-app.image.height*app.scale)/2;draw()}
  function imagePoint(event){const r=canvas.getBoundingClientRect();return [(event.clientX-r.left-app.ox)/(app.image.width*app.scale),(event.clientY-r.top-app.oy)/(app.image.height*app.scale)]}
  function screenPoint(p){return [app.ox+p[0]*app.image.width*app.scale,app.oy+p[1]*app.image.height*app.scale]}
  function path(points){if(!points.length)return;const p0=screenPoint(points[0]);ctx.beginPath();ctx.moveTo(...p0);for(const p of points.slice(1))ctx.lineTo(...screenPoint(p));ctx.closePath()}
  function draw(){
    const r=$('wrap').getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);if(!app.image)return;ctx.drawImage(app.image,app.ox,app.oy,app.image.width*app.scale,app.image.height*app.scale);
    app.polygons.forEach((poly,i)=>{const invalid=poly.issues&&poly.issues.length;path(poly.points);ctx.fillStyle=i===app.selected?'#ff6e6745':invalid?'#ff4fc933':'#28d7d022';ctx.strokeStyle=i===app.selected?'#ff6e67':invalid?'#ff69c8':'#42d5d0';ctx.lineWidth=i===app.selected?2.5:invalid?2:1;ctx.fill();ctx.stroke()});
    if(app.draft.length){const pts=app.draft.map(screenPoint);ctx.beginPath();ctx.moveTo(...pts[0]);for(const p of pts.slice(1))ctx.lineTo(...p);ctx.strokeStyle='#ffd15a';ctx.lineWidth=2;ctx.stroke();for(const p of pts){ctx.beginPath();ctx.arc(p[0],p[1],3,0,Math.PI*2);ctx.fillStyle='#ffd15a';ctx.fill()}}
  }
  function pointIn(p,poly){let inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if(((a[1]>p[1])!==(b[1]>p[1]))&&(p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0]))inside=!inside}return inside}
  function area(poly){let s=0;for(let i=0,j=poly.length-1;i<poly.length;j=i++)s+=poly[j][0]*poly[i][1]-poly[i][0]*poly[j][1];return Math.abs(s)/2}
  function selectAt(p){const hits=app.polygons.map((x,i)=>({i,a:area(x.points)})).filter(x=>pointIn(p,app.polygons[x.i].points)).sort((a,b)=>a.a-b.a);app.selected=hits.length?hits[0].i:-1;updateUi();draw()}
  function workspace(){return {polygons:app.polygons.map(p=>({class_id:p.class_id,points:p.points})),draft:app.draft,mode:app.mode,selected:app.selected}}
  function scheduleDraft(){clearTimeout(app.draftTimer);app.draftSaved=false;app.draftTimer=setTimeout(()=>saveDraft(false),450)}
  async function saveDraft(show=true){if(!app.item)return;clearTimeout(app.draftTimer);try{const data=await json('/api/item/'+encodeURIComponent(app.item.image)+'/draft',{method:'POST',body:JSON.stringify(workspace())});app.draftSaved=true;app.status=data.status;const row=app.items.find(x=>x.image===app.item.image);if(row)row.has_draft=true;renderList(app.status);updateUi();if(show)toast('当前草稿已暂存，可稍后继续')}catch(e){app.draftSaved=false;updateUi();if(show)toast(e.message,true)}}
  function markDirty(){app.dirty=true;app.draftSaved=false;updateUi();scheduleDraft()}
  function setMode(mode){if(mode==='redraw'&&app.selected<0)return toast('请先单击选择一个轮廓',true);app.mode=mode;app.draft=[];canvas.classList.add('draw');$('hint').textContent=mode==='add'?'在漏标目标边缘依次点击；至少 3 点，按 Enter 完成。':'沿正确边缘重新点击；至少 3 点，按 Enter 替换选中轮廓。';updateUi();draw()}
  function finishPolygon(){if(!app.mode)return;if(app.draft.length<3)return toast('至少需要 3 个点',true);const poly={class_id:'0',points:clone(app.draft),issues:[]};if(app.mode==='add'){app.polygons.push(poly);app.selected=app.polygons.length-1}else{poly.class_id=app.polygons[app.selected].class_id;app.polygons[app.selected]=poly}app.mode=null;app.draft=[];canvas.classList.remove('draw');markDirty();updateUi();draw()}
  function cancelDraw(){const hadDraft=app.draft.length>0;app.mode=null;app.draft=[];canvas.classList.remove('draw');$('hint').textContent='青色是现有标签，紫色是几何异常。单击轮廓可选中、重画或删除。';if(hadDraft)markDirty();else updateUi();draw()}
  function updateUi(){const drawing=!!app.mode;$('redraw').disabled=!app.item||app.selected<0||drawing;$('delete').disabled=!app.item||app.selected<0||drawing;$('add').disabled=!app.item||drawing;$('undoPoint').disabled=!drawing||!app.draft.length;$('finishPolygon').disabled=!drawing||app.draft.length<3;$('cancelDraw').disabled=!drawing;$('save').disabled=!app.item||drawing;$('saveDraft').disabled=!app.item;$('nextInvalid').disabled=!app.polygons.some(p=>p.issues&&p.issues.length);$('dirty').textContent=app.dirty?(app.draftSaved?'草稿已自动暂存':'正在暂存草稿…'):''}
  canvas.onpointerdown=e=>{if(!app.image)return;if(app.mode){const p=imagePoint(e);if(p[0]>=0&&p[0]<=1&&p[1]>=0&&p[1]<=1){app.draft.push(p);markDirty();draw()}return}app.drag={x:e.clientX,y:e.clientY,ox:app.ox,oy:app.oy,moved:false};canvas.setPointerCapture(e.pointerId)};
  canvas.onpointermove=e=>{if(!app.drag||app.mode)return;const dx=e.clientX-app.drag.x,dy=e.clientY-app.drag.y;if(Math.abs(dx)+Math.abs(dy)>4)app.drag.moved=true;app.ox=app.drag.ox+dx;app.oy=app.drag.oy+dy;draw()};
  canvas.onpointerup=e=>{if(!app.drag)return;const moved=app.drag.moved;app.drag=null;if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);if(!moved)selectAt(imagePoint(e))};
  canvas.oncontextmenu=e=>{e.preventDefault();if(app.mode)finishPolygon()};
  canvas.onwheel=e=>{e.preventDefault();if(!app.image)return;const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,f=e.deltaY<0?1.16:.86;app.ox=x-(x-app.ox)*f;app.oy=y-(y-app.oy)*f;app.scale*=f;draw()};
  $('zoomIn').onclick=()=>{app.scale*=1.2;draw()};$('zoomOut').onclick=()=>{app.scale*=.83;draw()};$('fit').onclick=fit;
  $('add').onclick=()=>setMode('add');$('redraw').onclick=()=>setMode('redraw');$('undoPoint').onclick=()=>{app.draft.pop();markDirty();draw()};$('finishPolygon').onclick=finishPolygon;$('cancelDraw').onclick=cancelDraw;$('saveDraft').onclick=()=>saveDraft(true);
  $('nextInvalid').onclick=()=>{const bad=app.polygons.map((p,i)=>p.issues&&p.issues.length?i:-1).filter(i=>i>=0);if(!bad.length)return toast('当前没有自动检测到的几何异常');const next=bad.find(i=>i>app.selected)??bad[0];app.selected=next;updateUi();draw();toast(`已定位第 ${next+1} 个轮廓：${app.polygons[next].issues.join(', ')}`)};
  $('delete').onclick=()=>{if(app.selected<0)return;if(confirm('确认从当前图片删除选中轮廓？保存前不会写入文件。')){app.polygons.splice(app.selected,1);app.selected=-1;markDirty();updateUi();draw()}};
  $('save').onclick=async()=>{try{const image=app.item.image;const data=await json('/api/item/'+encodeURIComponent(image)+'/save',{method:'POST',body:JSON.stringify({polygons:app.polygons})});toast(`已正式保存 ${app.polygons.length} 个轮廓`);app.dirty=false;app.draftSaved=true;app.item=data.item;const all=await json('/api/items');app.items=all.items;app.status=all.status;renderList(all.status);const next=app.items.find(x=>x.status==='pending');if(next)await openItem(next.image);else{updateUi();toast('20 张标注已全部完成')}}catch(e){const m=e.message.match(/第 (\d+) 个轮廓/);if(m){app.selected=Number(m[1])-1;draw()}toast(e.message,true)}};
  $('undoSave').onclick=async()=>{if(app.dirty&&!app.draftSaved)await saveDraft(false);try{const data=await json('/api/undo',{method:'POST',body:'{}'});toast(`已撤销 ${data.image}`);app.item=null;await refresh(data.image)}catch(e){toast(e.message,true)}};
  window.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();$('save').click();return}if(e.key==='Escape')cancelDraw();else if(e.key==='Enter')finishPolygon();else if(e.key==='Delete')$('delete').click();else if(e.key.toLowerCase()==='n')setMode('add');else if(e.key.toLowerCase()==='r')setMode('redraw');else if(e.key.toLowerCase()==='i')$('nextInvalid').click()};
  new ResizeObserver(resize).observe($('wrap'));window.addEventListener('pagehide',()=>{if(app.item&&app.dirty&&!app.draftSaved)fetch('/api/item/'+encodeURIComponent(app.item.image)+'/draft',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(workspace()),keepalive:true})});refresh().catch(e=>toast(e.message,true));
</script>
</body>
</html>
